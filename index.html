<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上雲端剪貼板 (GitHub版)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f5f5f7; color: #1d1d1f; }
    h2 { text-align: center; margin-bottom: 20px; }
    textarea { width: 100%; height: 220px; padding: 14px; border: 1px solid #d2d2d7; border-radius: 12px; box-sizing: border-box; font-size: 16px; margin-bottom: 14px; resize: vertical; outline: none; }
    textarea:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.2); }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-save { background: #0071e3; color: white; }
    .btn-save:hover { background: #0077ed; }
    .btn-copy { background: #34c759; color: white; }
    .btn-copy:hover { background: #30b753; }
    .btn-refresh { background: #8e8e93; color: white; }
    .btn-refresh:hover { background: #7c7c80; }
    #status { margin-top: 12px; text-align: center; font-size: 14px; color: #86868b; height: 20px; }
  </style>
</head>
<body>
  <h2>📋 線上雲端剪貼板</h2>
  <textarea id="text" placeholder="連線中..."></textarea>
  <div class="btn-group">
    <button class="btn-save" onclick="saveText()">上傳至雲端</button>
    <button class="btn-copy" onclick="copyText()">複製文字</button>
    <button class="btn-refresh" onclick="loadText()">重新整理</button>
  </div>
  <div id="status"></div>

  <script>
    // 👇👇👇 請將下面這行引號內的網址，換成你的 Apps Script (/exec) 網址 👇👇👇
    const API_URL = 'https://script.google.com/macros/s/AKfycbzQtUMmBGUkp7pzXFT3loONmWj-AaasO90rAz-oCmb1AUmKMpqIahdUXLyvWGNFunNV/exec';

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.innerText = msg;
      setTimeout(() => el.innerText = '', 3000);
    }

    async function loadText() {
      showStatus('讀取中...');
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        document.getElementById('text').value = data.text;
        showStatus('讀取成功！');
      } catch (error) {
        showStatus('讀取失敗，請檢查網路或 API 網址');
      }
    }

    async function saveText() {
      showStatus('上傳中...');
      const text = document.getElementById('text').value;
      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ text: text }),
          // Apps Script 跨網域請求需使用 text/plain 避免 CORS 預檢錯誤
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        showStatus('已同步至雲端！');
      } catch (error) {
        showStatus('上傳失敗');
      }
    }

    function copyText() {
      const text = document.getElementById('text').value;
      if (!text) return showStatus('內容為空！');
      navigator.clipboard.writeText(text).then(() => {
        showStatus('已複製到本機剪貼板！');
      }).catch(() => {
        showStatus('複製失敗，請手動複製');
      });
    }

    window.onload = loadText;
  </script>
</body>
</html>
